[package]
name = "jankurai"
version = "1.7.0"
edition = "2021"
description = "Agent-native repository audit CLI and standard."
license = "MIT"
repository = "https://github.com/neverhuman/jankurai-core"
homepage = "https://github.com/neverhuman/jankurai"
readme = "README.md"
keywords = ["agent", "audit", "cli", "governance", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
cargo_metadata = "0.19"
globset = "0.4"
ignore = "0.4"
jankurai-audit-analyzers = { git = "https://github.com/neverhuman/jankurai-tools-analyzers.git", tag = "ci-5744da4bb06434fdffecb8c5ec6f1091ff26b460", package = "jankurai-audit-analyzers", version = "0.1.0" }
jankurai-audit-dedup = { git = "https://github.com/neverhuman/jankurai-tools-dedup.git", tag = "ci-602b608c59690020eb66a2069f67d33a75b481f1", package = "jankurai-audit-dedup", version = "0.1.0" }
jankurai-audit-kernel = { git = "https://github.com/neverhuman/jankurai-tools-kernel.git", tag = "ci-55401b34cd39c4f22755f130986d2a5869a5b3d7", package = "jankurai-audit-kernel", version = "0.1.0" }
jankurai-fleet = { git = "https://github.com/neverhuman/jankurai-tools-fleet.git", tag = "ci-668532cd06f87aec6b677ab061405e51871e57b8", package = "jankurai-fleet", version = "0.1.0" }
jankurai-guard = { git = "https://github.com/neverhuman/jankurai-tools-guard.git", tag = "ci-ac11dec26907b986c62b1112fc6e781e1e2894c3", package = "jankurai-guard", version = "0.1.0", default-features = false }
jankurai-proofbind = { git = "https://github.com/neverhuman/jankurai-tools-proof.git", tag = "ci-dc7a6ffd84866a1572eaeab4c11e4f02028c5176", package = "jankurai-proofbind", version = "0.8.0" }
jankurai-proofmark = { git = "https://github.com/neverhuman/jankurai-tools-proof.git", tag = "ci-dc7a6ffd84866a1572eaeab4c11e4f02028c5176", package = "jankurai-proofmark", version = "0.8.0" }
once_cell = "1.21"
rayon = "1.11"
regex = "1.12"
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
semver = "1.0"
toml = "0.9"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
walkdir = "2.5"
ureq = { version = "2", default-features = false, features = ["json"] }

[features]
default = []
guard-fuse = ["jankurai-guard/fuse"]

[dev-dependencies]
tempfile = "3.23"
