name: ci

# Continuous integration for jankurai-core.
# Thin workflow: every job delegates to ops/ci/<lane>.sh so local runs and CI
# execute the exact same commands (see scripts/ci-local.sh). Three lanes:
# build/fast, security (secret + dependency scanning), and a jankurai audit
# lane that publishes one composition-bound evidence set.
# Every third-party action is pinned to a full 40-character commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: complete-quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install nextest
        uses: taiki-e/install-action@9ca1734d8940023f074414ee621fd530c4ce10f2 # v2.62.45
        with:
          tool: cargo-nextest@0.9.137
      - name: Install pinned public-mirror security tools
        run: bash ops/ci/bootstrap-public-ci-tools.sh
      - name: Run composition-bound quality gates
        run: bash ops/ci/quality-gates.sh
      - name: Upload complete quality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complete-quality-evidence
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/repair-queue.jsonl
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/proofbind/obligations.json
            target/jankurai/proofmark/proofmark-receipt.json
            target/jankurai/proofmark/proof-receipt.json
            target/jankurai/copy-code.json
            target/jankurai/copy-code.md
            target/jankurai/security/evidence.json
            target/jankurai/language-bad-behavior.log
            target/jankurai/vibe-coverage.json
            target/jankurai/vibe-coverage.md
            target/jankurai/coverage/coverage-audit.json
            target/jankurai/coverage/coverage-audit.md
  required:
    name: jankurai-core/required
    needs: quality
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: bash ops/ci/aggregate.sh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
  publish-ci-tag:
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: bash ops/ci/publish-ci-tag.sh
        env:
          GH_TOKEN: ${{ github.token }}
