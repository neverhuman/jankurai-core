# Generated zones for jankurai-core.
# The only generated output tree in this single-purpose Rust repo is target/,
# produced by Cargo. It is never hand-edited and is regenerated by the build.

[[zone]]
path = "target/"
source = "crates/jankurai (Cargo workspace)"
command = "cargo build --workspace --locked"
read_only = true
write_policy = "generator_only"
