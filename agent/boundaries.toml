# Boundary manifest for jankurai-core.
# This is a single-purpose Rust workspace: the jankurai auditor crate.
# Only the Rust domain block applies here; web, database, queue, and Python
# surfaces are not part of this repo. See docs/boundaries.md for prose.

[stack]
id = "rust-ts-vite-react-postgres-bounded-python"
version = "0.5.0"

[queues]
adapter_paths = []
event_contract_paths = []
generated_type_paths = []

[rust]
domain_paths = ["crates/jankurai/src/domain"]
forbidden_domain_imports = [
  "std::fs",
  "std::env",
  "std::net",
  "std::time::SystemTime",
  "rand::",
  "sqlx::",
  "diesel::",
  "reqwest::",
  "rdkafka::",
  "tracing::",
  "log::"
]
